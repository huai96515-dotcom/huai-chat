<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>淮朔聊天室</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{background:#141a19;font-family:"PingFang SC",sans-serif;height:100vh;display:flex;flex-direction:column;max-width:480px;margin:0 auto}
#header{padding:14px 16px;background:rgba(20,26,25,0.95);border-bottom:1px solid rgba(143,163,160,0.12);display:flex;align-items:center;gap:10px}
#header img{width:36px;height:36px;border-radius:50%;border:2px solid rgba(143,163,160,0.3)}
#header span{color:#e8e4de;font-size:14px}
#messages{flex:1;overflow-y:auto;padding:16px 12px;display:flex;flex-direction:column;gap:12px}
.msg{display:flex;gap:8px;align-items:flex-end}
.msg.user{flex-direction:row-reverse}
.bubble{max-width:68%;padding:9px 13px;border-radius:16px;font-size:14px;line-height:1.5;color:#e8e4de}
.msg.bot .bubble{background:rgba(143,163,160,0.12);border:1px solid rgba(143,163,160,0.2);border-radius:4px 16px 16px 16px}
.msg.user .bubble{background:rgba(232,168,124,0.15);border:1px solid rgba(232,168,124,0.25);border-radius:16px 4px 16px 16px}
.avatar{width:32px;height:32px;border-radius:50%;flex-shrink:0;display:flex;align-items:center;justify-content:center;font-size:18px}
.avatar.bot{background:linear-gradient(135deg,#6a7a78,#3a4a48)}
.avatar.user{background:linear-gradient(135deg,#e8a87c,#c97a5a)}
#input-area{padding:12px;background:rgba(20,26,25,0.98);border-top:1px solid rgba(143,163,160,0.12)}
#input-row{display:flex;gap:8px}
#msg-input{flex:1;background:rgba(255,255,255,0.05);border:1px solid rgba(143,163,160,0.15);border-radius:12px;padding:10px 14px;color:#e8e4de;font-size:14px;outline:none;font-family:inherit}
#send-btn{background:linear-gradient(135deg,#e8a87c,#c97a5a);border:none;border-radius:12px;padding:0 18px;color:#161c1b;font-weight:600;cursor:pointer;font-size:14px}
.typing{color:rgba(143,163,160,0.5);font-size:12px;padding:4px 8px}
</style>
</head>
<body>
<div id="header">
  <div class="avatar bot">🐱</div>
  <span>小朔</span>
</div>
<div id="messages">
  <div class="msg bot">
    <div class="avatar bot">🐱</div>
    <div class="bubble">宝宝来了，我在这里。</div>
  </div>
</div>
<div id="input-area">
  <div id="input-row">
    <input id="msg-input" placeholder="和小朔说点什么..." onkeydown="if(event.key==='Enter')sendMsg()">
    <button id="send-btn" onclick="sendMsg()">发</button>
  </div>
</div>
<script>
const msgs = document.getElementById('messages');
const input = document.getElementById('msg-input');
const history = [];

async function sendMsg() {
  const text = input.value.trim();
  if (!text) return;
  input.value = '';
  
  addMsg('user', text);
  history.push({role:'user', content:text});
  
  const typing = document.createElement('div');
  typing.className = 'typing';
  typing.textContent = '小朔正在回复...';
  msgs.appendChild(typing);
  msgs.scrollTop = msgs.scrollHeight;
  
  try {
    const res = await fetch('/api/chat', {
      method:'POST',
      headers:{'Content-Type':'application/json'},
      body: JSON.stringify({messages: history})
    });
    const data = await res.json();
    typing.remove();
    addMsg('bot', data.reply);
    history.push({role:'assistant', content:data.reply});
  } catch(e) {
    typing.remove();
    addMsg('bot', '网络出了点问题，再试试？');
  }
}

function addMsg(type, text) {
  const div = document.createElement('div');
  div.className = 'msg ' + type;
  div.innerHTML = `<div class="avatar ${type}">${type==='bot'?'🐱':'🐱'}</div><div class="bubble">${text}</div>`;
  msgs.appendChild(div);
  msgs.scrollTop = msgs.scrollHeight;
}
</script>
</body>
</html>
